<!-- order_response.html -->
{% extends 'myapp/base.html' %}

{% block body_block %}
    <h1>Order Response</h1>
    <p>Your order has been placed successfully. Here are the details:</p>
    <ul>
        {% for book in books %}
            <li>{{ book.title }}</li>
        {% endfor %}
    </ul>
    <p>Order Type: {{ order.get_order_type_display }}</p>
{% endblock %}
